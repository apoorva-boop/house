<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Push Spike</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Push Spike">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111827">
  <style>
    body { margin: 0; padding: max(24px, env(safe-area-inset-top)) 20px 40px; font: 17px/1.5 -apple-system, system-ui, sans-serif; background: #111827; color: #f3f4f6; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #d1d5db; }
    button { width: 100%; padding: 16px; font-size: 18px; font-weight: 600; border: 0; border-radius: 12px; background: #2563eb; color: #fff; }
    button:disabled { background: #374151; color: #9ca3af; }
    .box { margin-top: 16px; padding: 12px; border-radius: 10px; background: #1f2937; font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    .ok { color: #34d399; } .bad { color: #f87171; } .warn { color: #fbbf24; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 16px 0; font-size: 14px; }
    dt { color: #9ca3af; } dd { margin: 0; }
  </style>
</head>
<body>
  <h1>Push spike for issue #6</h1>
  <p>Add this page to your home screen, open it from there, then tap Subscribe.</p>

  <dl>
    <dt>Opened from</dt><dd id="mode">…</dd>
    <dt>Push API</dt><dd id="api">…</dd>
    <dt>Permission</dt><dd id="perm">…</dd>
    <dt>Stored on server</dt><dd id="stored">…</dd>
  </dl>

  <button id="subscribe" disabled>Subscribe</button>
  <div id="status" class="box">Loading…</div>
  <div id="sub" class="box" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
