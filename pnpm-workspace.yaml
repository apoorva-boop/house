packages:
  - "packages/*"
  - "apps/*"
  - "relay"

# esbuild ships a per-platform binary and needs its install script to run. It is the
# only dependency allowed to run one. `allowBuilds` is the pnpm 11 key;
# `onlyBuiltDependencies` is the pnpm 10 spelling, kept so an older CI pnpm agrees.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
