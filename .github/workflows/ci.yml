# Typecheck, lint and unit tests on every pull request and every push to main.
#
# The lint step is the load-bearing one. `eslint.config.js` is the only thing enforcing
# this project's hardest constraint: packages/domain must have no clock, no React, no
# browser globals and no Apps Script globals, so that the rules can be ported to a
# native app later. Without this workflow that constraint is enforced by memory. With
# it, it is enforced by machinery.
#
# Integration tests are deliberately NOT run here. `pnpm test:integration` talks to a
# real Google Sheet, a real Calendar and a deployed Apps Script /exec endpoint. Those
# need credentials (see .env.example), and this repo is public, so the credentials must
# never exist in it or in its Actions secrets for a fork-able PR workflow. Run
# `pnpm test:integration` locally against your own disposable Sheet and Calendar.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes an older run. Unlike the Pages deploy,
# cancelling a half-finished CI run costs nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. The action reads `packageManager` from the root
      # package.json, which keeps the pnpm version in one place for CI and for humans.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # A GATE. A build failure fails the job.
      #
      # `apps-script/build/` is gitignored, so this is the only place CI ever sees the
      # bundle. Without it, `scripts/build-domain.mjs` and `scripts/build-appsscript.mjs`
      # were unexercised code: a change that broke either of them would land green and be
      # discovered by hand at the next deploy.
      #
      # It matters more than an ordinary build step because `apps-script/src/Config.ts`
      # declares `Domain` AMBIENTLY. An ambient declaration emits nothing, so `pnpm
      # typecheck` above checks the server against a signature the deployed `domain.js`
      # is not obliged to have. Building is what turns that signature into a real file.
      - name: Build the Apps Script bundle
        run: pnpm build

      # Also a gate, and cheap. Here it proves the freshness stamping still works: the
      # step above has just built both halves from the same tree, so their fingerprints
      # must agree. If this fails right after a build, the stamping machinery is broken,
      # which would leave a stale deploy undetectable again.
      #
      # Its real job is local, not here. See the header of scripts/check-bundle.mjs.
      - name: Bundle freshness stamp
        run: pnpm check:bundle

      # A GATE. The unit suite is 71 of 71.
      #
      # It was reported-but-not-enforced while `apps/web/src/map/Camera.test.ts` was
      # written ahead of its implementation - eight tests recorded red on 2026-09-01 and
      # left red until PR 4. That file was the whole of the named list, it is green, and
      # so the relaxation is gone: a failing unit test now fails the job.
      - name: Unit tests
        run: pnpm test

  # The browser suite. Separate job because it needs a Chromium download and a Vite dev
  # server, and there is no reason to make the fast checks above wait for either.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # A GATE. All 25 browser tests pass, so a failing one is a regression.
      #
      # It has twice been relaxed while a batch of tests was written ahead of its
      # implementation and recorded red - PR 3's twelve, then PR 4's thirteen for the
      # map. Both batches are green, so both relaxations are gone. Relax it again only
      # to record a new batch red, name the expected failures as tests rather than as a
      # count, and tighten it the moment they pass.
      - name: Playwright
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
